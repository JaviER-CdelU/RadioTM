<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pedí tu canción | Radio Tiempo Muerto</title>
  <link rel="stylesheet" href="assets/css/pedido-directo.css">
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <div class="logo">RTM</div>
      <div>
        <span class="estado">● PRUEBA DIRECTA CON RADIOBOSS</span>
        <h1>Pedí tu canción</h1>
        <p>Esta prueba funciona desde la computadora donde está RadioBOSS.</p>
      </div>
    </header>

    <section class="tarjeta cancion">
      <div>
        <span class="etiqueta">CANCIÓN DE PRUEBA</span>
        <h2>ANGELA</h2>
        <h3>ES POR TI</h3>
        <p>Archivo comprobado en RadioBOSS.</p>
      </div>
      <div class="nota">🎵</div>
    </section>

    <section class="tarjeta">
      <form id="formPedido">
        <label>
          Tu nombre
          <input id="nombre" value="Pablo" maxlength="50" required>
        </label>

        <label>
          Desde dónde escuchás
          <input id="ciudad" value="Concepción del Uruguay" maxlength="70" required>
        </label>

        <label>
          Saludo o dedicatoria
          <textarea id="mensaje" maxlength="180">Pedido realizado desde Radio Tiempo Muerto</textarea>
        </label>

        <button type="submit">Enviar pedido a RadioBOSS</button>
      </form>

      <div class="aviso" id="aviso">
        Al enviar se abrirá otra pestaña. Si RadioBOSS está abierto debe aparecer <strong>OK</strong>.
      </div>
    </section>

    <a class="volver" href="index.html">← Volver al inicio</a>
  </main>

  <script>
    document.getElementById("formPedido").addEventListener("submit", function (evento) {
      evento.preventDefault();

      const nombre = document.getElementById("nombre").value.trim();
      const ciudad = document.getElementById("ciudad").value.trim();
      const mensaje = document.getElementById("mensaje").value.trim();

      const texto = [
        nombre ? "Pidió " + nombre : "",
        ciudad ? "desde " + ciudad : "",
        mensaje
      ].filter(Boolean).join(" — ");

      const parametros = new URLSearchParams({
        pass: "1",
        action: "songrequest",
        filename: "E:\\angela\\06_ES POR TI.mp3",
        message: texto
      });

      window.open("http://127.0.0.1:9000/?" + parametros.toString(), "_blank");
    });
  </script>
</body>
</html>
