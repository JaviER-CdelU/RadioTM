<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel de pedidos | Radio Tiempo Muerto</title>
  <link rel="stylesheet" href="css/pedidos.css">
  <style>
    .mensaje-acceso{margin-top:14px;padding:14px 16px;border-radius:12px;line-height:1.45;display:none;white-space:pre-line}
    .mensaje-acceso.visible{display:block}
    .mensaje-acceso.info{background:#fff7e6;border:1px solid #f0ad31;color:#5c3b00}
    .mensaje-acceso.error{background:#fff0f0;border:1px solid #d94a4a;color:#7b1111}
    .mensaje-acceso.ok{background:#edf9f0;border:1px solid #4ca968;color:#145b29}
    .acciones-acceso{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .acciones-acceso button{min-height:46px}
    .ayuda-acceso{margin-top:12px;font-size:.92rem;opacity:.86}
    .detalle-tecnico{font-family:ui-monospace,Consolas,monospace;font-size:.82rem;margin-top:8px;word-break:break-word}
  </style>
</head>
<body>
  <main class="contenedor">
    <header class="encabezado">
      <div class="marca">RTM</div>
      <div>
        <h1>Panel del operador</h1>
        <p class="subtitulo">Aprobá o rechazá los pedidos antes de enviarlos a RadioBOSS.</p>
      </div>
    </header>

    <section class="panel" id="acceso">
      <h2>Ingreso</h2>
      <p>Ingresá con la cuenta administradora <strong>rtiempomuerto@gmail.com</strong>.</p>

      <div class="acciones-acceso">
        <button id="ingresar" type="button">Ingresar con Google</button>
        <button id="ingresarRedireccion" class="secundario" type="button">Ingresar en pantalla completa</button>
      </div>

      <div id="mensajeAcceso" class="mensaje-acceso" role="status" aria-live="polite"></div>
      <p class="ayuda-acceso">Esta versión ya no oculta los errores: si Google cierra la ventana, el motivo aparecerá escrito aquí.</p>
    </section>

    <section class="panel oculto" id="panel">
      <div class="acciones">
        <button class="secundario" id="salir" type="button">Cerrar sesión</button>
      </div>
      <h2>Pedidos pendientes</h2>
      <div id="pedidos" class="pedidos"></div>
    </section>
  </main>

  <script type="module" src="js/admin-pedidos.js?v=17"></script>
</body>
</html>
